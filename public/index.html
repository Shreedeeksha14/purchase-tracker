<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Purchase Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <h1>Purchase Tracker</h1>
    <p>Create a purchase, then select items and quantities to add to it. Stock is checked automatically.</p>
  </header>

  <main class="container">

    <!-- ============ STEP 1: CREATE A PURCHASE ============ -->
    <section class="card">
      <h2>1. Create a Purchase</h2>
      <form id="purchase-form" class="inline-form">
        <label>
          Purchase Date <span class="req">*</span>
          <input type="date" id="new-purchase-date" required />
        </label>
        <button type="submit" class="btn btn-primary">Create Purchase</button>
      </form>
      <div id="purchase-form-error" class="error-box" hidden></div>
    </section>

    <!-- ============ STEP 2: ADD ITEMS TO A PURCHASE ============ -->
    <section class="card">
      <h2>2. Add Item to a Purchase</h2>
      <form id="item-form" class="item-form">
        <label>
          Select Purchase <span class="req">*</span>
          <select id="item-purchase-id" required>
            <option value="">Select purchase&hellip;</option>
          </select>
        </label>

        <label>
          Item Name <span class="req">*</span>
          <select id="item-select" required>
            <option value="">Select item&hellip;</option>
          </select>
          <span id="item-stock-hint" class="stock-hint"></span>
        </label>

        <label>
          Item Type
          <span id="item-type-display" class="readonly-field">&mdash;</span>
        </label>

        <label>
          Quantity <span class="req">*</span>
          <input type="number" id="item-quantity" min="1" step="1" required placeholder="1" />
        </label>

        <button type="submit" class="btn btn-primary">Add Item</button>
      </form>
      <div id="item-form-error" class="error-box" hidden></div>
    </section>

    <!-- ============ STEP 3: DISPLAY DATA ============ -->
    <section class="card">
      <h2>3. All Purchases &amp; Items</h2>
      <div id="table-message" class="message-box" hidden></div>
      <div class="table-wrap">
        <table id="data-table">
          <thead>
            <tr>
              <th>Purchase</th>
              <th>Item ID</th>
              <th>Item Name</th>
              <th>Item Type</th>
              <th>Quantity</th>
              <th>Stock Left</th>
              <th>Purchase Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="data-tbody">
            <tr><td colspan="8" class="empty-row">No purchases yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
